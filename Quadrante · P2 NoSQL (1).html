<script>
const B=["MongoDB","Redis","NoSQL geral","Cassandra"];
const MC=[
[0,"Qual comando insere um documento no MongoDB?",["INSERT INTO","db.collection.insertOne()","db.insert()","insert_doc()"],1],
[0,"Qual o formato padrão de armazenamento no MongoDB?",["XML","CSV","JSON-like BSON","SQL"],2],
[0,"Qual comando retorna todos os documentos de uma coleção?",["SELECT * FROM collection","db.collection.find()","db.collection.select()","db.findAll()"],1],
[0,"O MongoDB suporta quais opções?",["Transações ACID","Sharding","Views","Todas as alternativas acima"],3],
[0,"Qual NÃO é caso de uso ideal para MongoDB?",["Catálogo de produtos","Sistema de logs","Sistema bancário","Aplicações IoT"],2],
[1,"Qual comando insere um valor em uma chave no Redis?",["SET key value","INSERT key value","ADD key value","PUT key value"],0],
[1,"O Redis é amplamente utilizado para:",["Cache","Filas","Pub/Sub","Todas as anteriores"],3],
[1,"Qual estrutura NÃO é suportada pelo Redis?",["Listas","Árvore binária","Hashes","Conjuntos ordenados"],1],
[1,"Qual comando recupera o valor de uma chave no Redis?",["GET key","FETCH key","RETRIEVE key","PULL key"],0],
[1,"O Redis armazena dados principalmente:",["No disco","Na memória RAM","Na memória Flash","Em sistema de arquivos distribuído"],1],
[2,"Qual NÃO é categoria de NoSQL?",["Grafos","Orientado a documentos","Tabular","Chave-valor"],2],
[2,"NoSQL é mais adequado para:",["Aplicações com alta escalabilidade","Dados fortemente estruturados","Transações bancárias complexas","Livros contábeis"],0],
[2,"Característica comum à maioria dos NoSQL:",["Suporte a ACID","Schema-less","Dependência de tabelas relacionais","Baseado em XML"],1],
[2,"Vantagem dos bancos NoSQL:",["Alta escalabilidade horizontal","Consistência forte por padrão","Estruturas rígidas de tabelas","Uso exclusivo em pequenas aplicações"],0],
[2,"NoSQL é mais recomendado para:",["Grandes volumes de dados não estruturados","Dados altamente relacionais","Pouca necessidade de escalabilidade","Aplicações monolíticas"],0],
[3,"Uma das principais características do Cassandra:",["Tabelas relacionais normalizadas","Arquitetura centralizada com servidor principal","Arquitetura distribuída, escalabilidade horizontal e alta disponibilidade","Chaves estrangeiras obrigatórias","Exclusivamente documentos JSON"],2],
[3,"Qual recurso mantém os dados disponíveis quando um dos 3 nós falha?",["Normalização","Replicação de dados entre os nós","Chaves estrangeiras","Centralização em um servidor","Índices relacionais"],1],
[3,"Comando correto para criar o keyspace empresa:",["CREATE DATABASE empresa;","CREATE TABLE empresa;","CREATE KEYSPACE empresa;","INSERT KEYSPACE empresa;","USE DATABASE empresa;"],2],
[3,"Comando CQL para inserir um registro na tabela alunos:",["ADD INTO alunos ...","INSERT INTO alunos (id, nome, curso, idade) VALUES (...)","CREATE INTO alunos ...","UPDATE alunos SET (...) VALUES (...)","APPEND alunos ..."],1],
[3,"PRIMARY KEY (id_cliente, id_venda): o que é cada campo?",["id_venda é partição, id_cliente é coluna comum","id_cliente é partição e id_venda é clustering","Ambos são colunas comuns","data_venda é a partição obrigatória","Não permite chave composta"],1]
];
const D=[
[0,"Como o MongoDB armazena documentos? Diferença entre coleção e documento.","BSON (JSON binário): pares campo-valor com arrays e subdocumentos. Documento = registro individual. Coleção = conjunto de documentos (≈ tabela), sem exigir a mesma estrutura."],
[0,"Importância dos índices no MongoDB e impacto no desempenho.","Evitam varrer a coleção inteira: aceleram filtros, ordenações e buscas. Custo: ocupam espaço e deixam escritas um pouco mais lentas. Criar nos campos mais consultados."],
[0,"Exemplo de aplicação que se beneficia do MongoDB.","Catálogo de e-commerce: atributos diferentes por produto (notebook: processador/memória; camiseta: tamanho/cor). Avaliações embutidas como subdocumentos evitam joins; novos tipos sem alterar esquema."],
[0,"Desafios de escalar o MongoDB em aplicações distribuídas.","Sharding: escolher a shard key (má escolha = distribuição desigual/hot spots), rebalancear shards, consultas sem shard key varrem todos os shards, atraso de replicação, transações distribuídas caras, operação/monitoramento complexos."],
[0,"Conceito de agregações no MongoDB e utilidade.","Pipeline de estágios ($match, $group, $sort, $project, $lookup); saída de cada um alimenta o próximo. Filtra, agrupa e calcula somas/médias/contagens no banco. Ex.: total de vendas por categoria."],
[1,"Como funciona o chave-valor no Redis e principais aplicações.","Dados na RAM como pares chave→valor; chave única; valor pode ser string, lista, hash, set ou sorted set. Acesso direto pela chave, muito rápido. Usos: cache, sessões, contadores, ranking, filas, pub/sub."],
[1,"Diferença entre persistência RDB e AOF.","RDB: snapshots periódicos; compacto e restauração rápida, mas perde o que veio após o último snapshot. AOF: log de cada escrita, reexecutado na recuperação; mais durável, arquivos maiores e recuperação mais lenta. Podem ser usados juntos."],
[1,"Benefícios do Redis em aplicação de alta performance.","RAM → latência baixíssima e alto volume de ops/s; estruturas versáteis; reduz carga do banco principal (cache); replicação para disponibilidade."],
[1,"Como o Redis gerencia a expiração de chaves e vantagens.","EXPIRE chave seg / SETEX chave seg valor definem TTL. Ao expirar, é removida (no acesso ou por varredura periódica). Libera memória sozinho; ideal para cache, sessões e tokens temporários."],
[1,"Exemplo prático de fila de mensagens com Redis.","Lista: produtor LPUSH fila msg; consumidor BRPOP fila 0 (bloqueante). Ex.: envio de e-mails em segundo plano, processados na ordem de chegada."],
[2,"Principais diferenças entre relacional e NoSQL.","Relacional: esquema fixo, tabelas, SQL, ACID, joins, escala vertical. NoSQL: esquema flexível, vários modelos (documento, chave-valor, colunas, grafos), escala horizontal, muitas vezes consistência eventual; indicado p/ grandes volumes e dados variados."],
[2,"Vantagens e desvantagens do NoSQL em aplicações empresariais.","Vantagens: escalabilidade horizontal, flexibilidade de esquema, desempenho, alta disponibilidade. Desvantagens: consistência mais fraca, sem padrão de consulta, pouco suporte a joins/consultas complexas, menos integridade garantida pelo banco."],
[2,"As 4 categorias de NoSQL e casos de uso.","Documentos (MongoDB): catálogos, CMS. Chave-valor (Redis): cache e sessões. Família de colunas (Cassandra): logs, séries temporais, escrita massiva. Grafos (Neo4j): redes sociais, recomendação, fraude."],
[2,"Cenários em que NoSQL NÃO é a escolha ideal.","Sistemas financeiros/contábeis com ACID complexo; dados muito relacionados com muitos joins; esquema estável e volume pequeno; relatórios ad hoc complexos (ERP)."],
[2,"Desafios de integrar NoSQL com sistemas legados.","Modelo e linguagem diferentes (SQL × APIs próprias); sem integridade referencial e ACID completo; migração/transformação de dados; sincronização entre bases; consistência eventual; incompatibilidade com ferramentas; capacitação da equipe."],
[3,"Q6 – Família de colunas × relacional (organização, flexibilidade, escalabilidade, exemplos).","Dados em tabelas com linhas identificadas por chave, agrupadas em partições distribuídas entre nós. Desnormalizado e modelado por consulta (relacional: normalizado, FK e joins). Linhas podem ter colunas diferentes (relacional: esquema rígido). Escala horizontal adicionando nós (relacional: vertical). Exemplos: Cassandra e HBase em IoT, logs, séries temporais, mensagens, histórico de transações."],
[3,"Q7 – Arquitetura distribuída e replicação do Cassandra (cluster de 5 nós). E se um nó cair?","Sem nó mestre: todos os nós têm o mesmo papel e formam um anel. Hash da chave de partição distribui os dados; fator de replicação define nº de cópias (ex.: 3). Se um nó cai, as outras réplicas atendem leituras e escritas; escritas do nó falho ficam como hints e ele é sincronizado ao voltar."],

  app.innerHTML=`${head()}<div class="card q" ${st}><h2>${esc(q.q)}</h2>${q.o.map((o,k)=>`<button class="opt" onclick="pick(${k})"><b class="lt">${"abcde"[k]}</b><span>${esc(o)}</span></button>`).join("")}</div><div id="nx"></div>`;
 }else{
  app.innerHTML=`${head()}<div class="card q" ${st}><h2>${esc(q.q)}</h2><textarea id="ta" placeholder="Escreva sua resposta (ou responda de cabeça)..."></textarea><button class="btn go" id="rv" onclick="rev()">Ver resposta</button><div id="ra"></div></div>`;
 }
}
function mat(k){
 const b=S[k][1],c=b>=0?`var(--c${b})`:"var(--ac)";
 app.innerHTML=`<div class="top"><button class="x" onclick="home()" aria-label="Início">←</button><span class="wm">Material de estudo</span></div><div class="chips">${S.map((s,j)=>`<button class="chip ${j==k?"on":""}" onclick="mat(${j})">${s[0]}</button>`).join("")}</div><div class="card mat" style="--c:${c}"><h2 class="mh">${b>=0?G(b):""}${S[k][0]}</h2>${S[k][2]}<button class="btn go" onclick="${b>=0?`prac(${b})`:"cfg.b=new Set([0,1,2,3]);cfg.t='all';start(pool())"}">Praticar quiz${b>=0?" de "+S[k][0]:" (tudo)"}</button></div>`;
 window.scrollTo(0,0);
}
const TL=['Os 4 bancos lado a lado','Documentos flexíveis em BSON','Chave-valor na RAM, latência mínima','Anel sem mestre, escrita massiva','Visão geral e as 4 categorias','Cenário → banco certo','O que mais derruba na prova'],DBC={MongoDB:0,Redis:1,Cassandra:3,Neo4j:2};
function mat(k){
 const b=S[k][1],c=b>=0?`var(--c${b})`:"var(--ac)",lg='<span class="logo">'+[0,1,2,3].map(j=>`<i style="background:var(--c${j})"></i>`).join("")+'</span>';
 const pt=S[k][2].split("<h3>"),body=pt[0]+pt.slice(1).map(p=>{const e=p.indexOf("</h3>");return `<details class="sec" open><summary>${p.slice(0,e)}</summary>${p.slice(e+5)}</details>`}).join("");
 app.innerHTML=`<div class="top"><button class="x" onclick="home()" aria-label="Início">←</button><span class="wm">Material de estudo</span></div>
 <div class="chips tabs">${S.map((s,j)=>`<button class="chip ${j==k?"on":""}" style="--c:${s[1]>=0?`var(--c${s[1]})`:"var(--ac)"}" onclick="mat(${j})">${s[0]}</button>`).join("")}</div>
 <div class="mhero" style="--c:${c}">${b>=0?G(b):lg}<div><h2 class="mh">${S[k][0]}</h2><p class="mu">${TL[k]}</p></div></div>
 <div class="card mat" style="--c:${c}">${body}</div>
 <button class="btn go" onclick="${b>=0?`prac(${b})`:"cfg.b=new Set([0,1,2,3]);cfg.t='all';start(pool())"}">Praticar quiz${b>=0?" de "+S[k][0]:" (tudo)"}</button>${k<S.length-1?`<button class="btn sec" onclick="mat(${k+1})">Próximo: ${S[k+1][0]} →</button>`:""}`;
 document.querySelectorAll(".mat pre").forEach(p=>{p.innerHTML=esc(p.textContent).replace(/\b(CREATE KEYSPACE|CREATE TABLE|INSERT INTO|PRIMARY KEY|DELETE FROM|SELECT|UPDATE|WHERE|VALUES|USE|SETEX|EXPIRE|LPUSH|BRPOP|SET|GET|FROM|WITH|insertOne|find|aggregate)\b/g,m=>`<span class="kw">${m}</span>`).replace(/\/\/.*/g,m=>`<span class="cm">${m}</span>`)});
 if(k==0)document.querySelectorAll(".mat th").forEach((t,j)=>{if(j)t.style.borderTop=`4px solid var(--c${[0,1,3,2][j-1]})`});
 if(k==5)document.querySelectorAll(".mat tr td:nth-child(2)").forEach(t=>{const j=DBC[t.textContent];t.innerHTML=`<span class="pill" style="--c:${j==null?"var(--mu)":`var(--c${j})`}">${t.textContent}</span>`});
 document.querySelector(".tabs .on").scrollIntoView({inline:"center",block:"nearest"});
 window.scrollTo(0,0);
}
let R=[];
function start(p){Q=p.slice();Q.forEach(q=>{delete q.r;delete q.s});if(cfg.sh)Q.sort(()=>Math.random()-.5);i=0;hits=0;miss=[];R=[];show()}
function head(){
 const q=Q[i];
 return `<div class="top"><button class="x" onclick="home()" aria-label="Sair">✕</button><div class="seg6">${Q.map((z,k)=>`<i style="background:${R[k]==1?"var(--ok)":R[k]==0?"var(--er)":`var(--c${z.b})`};opacity:${k<=i||R[k]!=null?1:.2}"></i>`).join("")}</div><span class="sc2"><b class="h-ok">✓ ${hits}</b><b class="h-er">✕ ${miss.length}</b></span></div><div class="bt" style="--c:var(--c${q.b})">${G(q.b)}<b>${B[q.b]}</b><span class="mu">${q.k=="mc"?"Múltipla escolha":"Dissertativa"} · ${i+1} de ${Q.length}</span></div>`;
}
function pick(k){
 const q=Q[i],ok=k==q.c;q.s=k;q.r=ok?1:0;R[i]=q.r;
 document.querySelectorAll(".opt").forEach((b,j)=>{b.disabled=true;if(j==q.c){b.classList.add("ok");b.insertAdjacentHTML("beforeend",`<b class="mk">✓ ${ok?"":"certa"}</b>`)}else if(j==k){b.classList.add("er");b.insertAdjacentHTML("beforeend",'<b class="mk">✕ sua resposta</b>')}else b.classList.add("dim")});
 ok?hits++:miss.push(q);
 const sg=document.querySelectorAll(".seg6 i")[i];sg.style.background=ok?"var(--ok)":"var(--er)";
 document.querySelector(".sc2").innerHTML=`<b class="h-ok">✓ ${hits}</b><b class="h-er">✕ ${miss.length}</b>`;
 $("#nx").innerHTML=`<div class="fb ${ok?"ok":"er"}"><span class="fi">${ok?"✓":"✕"}</span><div><b>${ok?"Acertou!":"Errou"}</b><div class="mu">${ok?"":"Certa: "}${"abcde"[q.c]}) ${esc(q.o[q.c])}</div></div></div><button class="btn go" onclick="nxt()">${i+1<Q.length?"Próxima":"Ver resultado"}</button>`;
 $("#nx").scrollIntoView({behavior:"smooth",block:"nearest"});
}
function rev(){
 $("#rv").remove();$("#ta").readOnly=true;
 $("#ra").innerHTML=`<div class="ans"><b>Resposta-modelo</b>\n${esc(Q[i].a)}</div><div class="mu">Compare com a sua. Como foi?</div><div class="row"><button class="btn erb" onclick="gr(0)">Preciso revisar</button><button class="btn okb" onclick="gr(1)">Acertei</button></div>`;
 $("#ra").scrollIntoView({behavior:"smooth",block:"nearest"});
}
function gr(ok){const q=Q[i];q.r=ok;R[i]=ok;if(ok)hits++;else miss.push(q);nxt()}
function end(){
 const tot=Q.length,pc=Math.round(hits/tot*100),rc=pc>=70?"var(--ok)":pc>=40?"var(--ac)":"var(--er)",
 tt2=pc>=85?"Pronto para a prova":pc>=60?"Falta pouco":"Vale revisar o material",MI=[1,2,4,3],
 bl=[...new Set(Q.map(q=>q.b))].map(b=>{const l=Q.filter(q=>q.b==b);return{b,n:l.length,h:l.filter(q=>q.r==1).length}}),
 pior=bl.filter(x=>x.h<x.n).sort((a,c)=>a.h/a.n-c.h/c.n)[0];
 app.innerHTML=`<div class="top"><button class="x" onclick="home()" aria-label="Início">←</button><span class="wm">Resultado</span></div>
 <div class="rh" style="--rc:${rc}"><svg class="ring" viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" stroke="var(--bd)" stroke-width="12"/><circle cx="60" cy="60" r="52" fill="none" stroke="var(--rc)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${pc*3.267} 327" transform="rotate(-90 60 60)"/><text x="60" y="69" text-anchor="middle" class="rt">${pc}%</text></svg><div><h2>${tt2}</h2><p class="mu">${hits} de ${tot} certas · ${miss.length} para revisar</p></div></div>
 <div class="card"><b>Por quadrante</b>${bl.map(x=>`<div class="bk" style="--c:var(--c${x.b})">${G(x.b)}<div><b>${B[x.b]}</b><div class="bar2"><i style="width:${x.h/x.n*100}%"></i></div></div><span class="bs">${x.h}/${x.n}</span></div>`).join("")}</div>
 ${miss.length?`<h2 class="rt2">Para revisar</h2>`+miss.map(q=>`<div class="rv" style="--c:var(--c${q.b})"><div class="bt">${G(q.b)}<b>${B[q.b]}</b></div><b>${esc(q.q)}</b>${q.k=="mc"?`<div class="ln h-er"><i>✕</i><span>Sua resposta: ${"abcde"[q.s]}) ${esc(q.o[q.s])}</span></div><div class="ln h-ok"><i>✓</i><span>Certa: ${"abcde"[q.c]}) ${esc(q.o[q.c])}</span></div>`:`<div class="ans">${esc(q.a)}</div>`}</div>`).join(""):`<div class="fb ok"><span class="fi">✓</span><div><b>Gabaritou!</b></div></div>`}
 ${miss.length?`<button class="btn go" onclick="start(miss.slice())">Refazer só os erros (${miss.length})</button>`:""}
 ${pior?`<button class="btn sec" onclick="mat(${MI[pior.b]})">Revisar material de ${B[pior.b]}</button>`:""}
 <button class="btn sec" onclick="home()">Início</button>`;
 window.scrollTo(0,0);
}
home();
</script></body></html>
